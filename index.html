<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/view/css/login.css">
    <title>Login | Spotify</title>
</head>
<body>
    <div class="container">
        <div class="img">
            <img src="/src/resources/login.png" alt="bro">
        </div>
        <div class="card">
            <div class="title">
                <h1>Login</h1>
            </div>
            <form method="post">
                <div class="campo">
                    <label for="username">Nome de utilizador</label>
                    <input type="text" id="username" name="username" placeholder="John Doe">
                </div>

                <div class="campo">
                    <label for="password">Palavra-Passe</label>
                    <input type="password" placeholder="Tua palavra-passe">
                </div>

                <div class="center">
                    <button type="submit">Login</button>
                </div>
                <hr>
                <div class="center"><a href="#">Pedir reset de senha</a></div>
            </form>
        </div>
    </div>
</body>
</html>
